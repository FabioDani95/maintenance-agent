<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Knowledge Agents Dev UI</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/dev-ui/static/css/app.css"/>

</head>
<body>

<div class="layout">
  <header>
    <div class="logo" id="header-logo">TS</div>
    <h1 id="header-title">Troubleshooting Assistant</h1>
    <span class="sub">Knowledge-grounded</span>
    <div class="spacer"></div>
    <span class="mode-label">Instance:</span>
    <select id="instance-select" title="Knowledge graph instance"></select>
    <span class="mode-label">Mode:</span>
    <select id="model-select" title="Thinking intensity">
      <option value="gpt-5-nano" selected>⚡ Fast</option>
      <option value="gpt-5-mini">🔧 Normal</option>
      <option value="gpt-5.4">🧠 Deep</option>
      <option value="gpt-5">🔬 Thorough</option>
    </select>
    <button id="reset-btn" title="Start a new conversation">New chat</button>
  </header>

  <!-- Left: Knowledge Graph -->
  <div class="graph-panel">
    <div class="graph-overlay-controls" id="graph-overlay-controls">
      <label class="overlay-toggle">
        <input type="checkbox" id="overlay-include-logs"/>
        <span>Show logs</span>
      </label>
      <input type="text" id="overlay-log-query" placeholder="filter logs by query (empty = top by recurrence)" />
      <button id="overlay-apply-btn" title="Apply log overlay">Apply</button>
    </div>
    <div id="network"></div>
    <div class="graph-legend" id="graph-legend"></div>
    <div class="graph-status" id="graph-status">Loading graph…</div>
    <div class="graph-hint">Drag to pan · Scroll to zoom</div>
    <div class="session-stats" id="session-stats">
      <span>Symptoms: <span class="stat-value" id="stat-symptoms">0</span></span>
      <span>Failure modes: <span class="stat-value" id="stat-fms">0</span></span>
      <span>Actions: <span class="stat-value" id="stat-actions">0</span></span>
      <span>Coverage: <span class="stat-value" id="stat-coverage">0%</span></span>
    </div>
    <!-- PDF overlay (hidden by default) -->
    <div id="pdf-overlay">
      <div class="pdf-header">
        <span class="pdf-title" id="pdf-title"></span>
        <span class="pdf-page-label" id="pdf-page-label"></span>
        <button class="pdf-close-btn" id="pdf-close-btn" title="Close manual">&times;</button>
      </div>
      <iframe id="pdf-iframe"></iframe>
    </div>
  </div>

  <!-- Vertical resizer between graph and chat -->
  <div class="resizer resizer-v" id="resizer-v"></div>

  <!-- Right: Chat -->
  <div class="chat-panel">
    <div class="chat-header">
      <span class="fixer-badge">
        <svg class="fixer-icon-small" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
          <circle cx="16" cy="10" r="5" fill="#f0883e"/>
          <rect x="10" y="16" width="12" height="2" rx="1" fill="#58a6ff"/>
          <rect x="9" y="19" width="14" height="7" rx="3" fill="#1f6feb"/>
          <rect x="6" y="20" width="5" height="2" rx="1" fill="#1f6feb" transform="rotate(-30 8.5 21)"/>
          <rect x="21" y="20" width="5" height="2" rx="1" fill="#1f6feb" transform="rotate(30 23.5 21)"/>
          <rect x="13" y="15" width="6" height="1.5" rx="0.75" fill="#f0883e"/>
          <rect x="7" y="12" width="18" height="4" rx="2" fill="#30363d"/>
          <rect x="10" y="11.5" width="12" height="3" rx="1.5" fill="#484f58"/>
        </svg>
        The Fixer
      </span>
    </div>
    <div id="messages">
      <div class="msg assistant">Loading development UI…</div>
    </div>
    <div id="input-area">
      <textarea id="user-input" rows="1" placeholder="Describe your asset issue…"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Horizontal resizer between main row and telemetry -->
  <div class="resizer resizer-h" id="resizer-h"></div>

  <!-- Bottom: Telemetry Panel -->
  <div class="telemetry-panel" id="telemetry-panel">
    <div class="telemetry-header" id="telemetry-header">
      <span class="telemetry-title">Sensor Data</span>
      <button class="telemetry-toggle-btn" id="telemetry-toggle-btn" title="Collapse panel">&#9660;</button>
    </div>
    <div class="telemetry-content" id="telemetry-content"></div>
  </div>
</div>

  <script src="/dev-ui/static/js/app.js"></script>

</body>
</html>
